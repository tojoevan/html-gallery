{# 全站统一页脚（自包含样式） #}
<style>
  .site-foot {
    margin-top: 3rem; border-top: 1px solid var(--border, #e8eaed);
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  }
  .site-foot-inner {
    max-width: 1200px; margin: 0 auto;
    padding: 1.5rem;
    display: flex; flex-wrap: wrap; gap: .75rem 1.25rem;
    align-items: center; justify-content: space-between;
    font-size: .82rem; color: var(--muted, #8a8fa8);
  }
  .site-foot-brand { font-weight: 600; color: var(--text, #1a1a2e); }
  .site-foot-brand span { color: var(--accent, #5b6af0); }
  .site-foot-links { display: flex; flex-wrap: wrap; gap: .25rem 1rem; }
  .site-foot-links a {
    color: var(--muted, #8a8fa8); text-decoration: none;
    padding: .15rem 0; transition: color .15s;
  }
  .site-foot-links a:hover { color: var(--accent, #5b6af0); }
  @media (max-width: 640px) {
    .site-foot-inner { padding: 1.25rem 1rem; flex-direction: column; align-items: flex-start; gap: .6rem; }
  }
</style>
<footer class="site-foot">
  <div class="site-foot-inner">
    <span class="site-foot-brand">HTML<span>Gallery</span> · 把 AI 生成的网页分享出去</span>
    <div class="site-foot-links">
      <a href="{{ url_for('index') }}">首页</a>
      {% if session.user_id %}<a href="{{ url_for('dashboard') }}">我的作品</a>{% endif %}
      <a href="{{ url_for('recover') }}">找回码</a>
      <a href="{{ url_for('privacy') }}">隐私与数据</a>
    </div>
  </div>
</footer>
