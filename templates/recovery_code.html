<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你的找回码 - HTML Gallery</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<meta name="robots" content="noindex">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: #f8f9fb; color: #1a1a2e;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem;
  }
  .card {
    background: #fff; width: 100%; max-width: 440px; border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,.08); padding: 2.2rem 2rem; text-align: center;
    min-width: 0;
  }
  h1 { font-size: 1.3rem; font-weight: 600; margin-bottom: .5rem; }
  .sub { font-size: .85rem; color: #8a8fa8; line-height: 1.7; margin-bottom: 1.6rem; }
  .code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 1.5rem; letter-spacing: .12em; font-weight: 600;
    background: #f4f6ff; border: 1px dashed #adc6ff; color: #1d39c4;
    padding: 1rem .6rem; border-radius: 10px; margin-bottom: 1rem;
    word-break: break-all; overflow-wrap: anywhere; user-select: all;
  }
  @media (max-width: 420px) {
    .card { padding: 1.8rem 1.1rem; }
    .code { font-size: 1.15rem; letter-spacing: .08em; padding: .85rem .4rem; }
  }
  .actions { display: flex; gap: .6rem; margin-bottom: 1.4rem; }
  button, a.btn {
    flex: 1; padding: .7rem; border-radius: 8px; font-size: .9rem; font-weight: 500;
    cursor: pointer; text-decoration: none; text-align: center; border: 1px solid transparent;
  }
  .copy { background: #5b6af0; color: #fff; border: none; }
  .copy:hover { opacity: .88; }
  a.btn.ghost { background: #fff; color: #5b6af0; border-color: #d5d9ff; }
  .warn {
    font-size: .8rem; line-height: 1.8; color: #a8071a; background: #fff1f0;
    border: 1px solid #ffccc7; border-radius: 8px; padding: .75rem .9rem; text-align: left;
  }
  .warn b { font-weight: 600; }
</style>
</head>
<body>

<div class="card">
  <h1>这是你的找回码</h1>
  <div class="sub">换设备或清了 Cookie 后，到「用找回码恢复作品」输入它，<br>就能重新打开这些临时作品。</div>

  <div class="code" id="code">{{ code }}</div>

  <div class="actions">
    <button type="button" class="copy" id="copy">复制</button>
    <a class="btn ghost" href="{{ url_for('dashboard') }}">回我的看板</a>
  </div>

  <div class="warn">
    <b>只显示这一次。</b>我们只保存它的摘要，之后任何人都无法再读出明文；没存下来就只能回看板「重新生成」（旧码立即作废）。<br>
    别把它发给别人——它等同于这个临时账号的钥匙。<br>
    <span style="color:#8a8fa8;">刷新本页会生成并显示另一个新码，当前这个随即失效。</span>
  </div>
</div>

<script>
(function () {
  var btn = document.getElementById('copy');
  var text = document.getElementById('code').textContent.trim();
  btn.addEventListener('click', function () {
    var done = function () { btn.textContent = '已复制'; setTimeout(function () { btn.textContent = '复制'; }, 1600); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, done);
    } else {
      var r = document.createRange();
      r.selectNodeContents(document.getElementById('code'));
      var s = window.getSelection();
      s.removeAllRanges(); s.addRange(r);
      try { document.execCommand('copy'); } catch (e) {}
      done();
    }
  });
})();
</script>

</body>
</html>
