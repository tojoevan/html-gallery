<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极简待办清单</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { min-height: 100vh; font-family: -apple-system, "PingFang SC", sans-serif;
         background: linear-gradient(160deg, #eef2ff 0%, #fdf2f8 100%); display: flex; justify-content: center; padding: 40px 20px; }
  .app { width: 100%; max-width: 520px; background: #fff; border-radius: 20px; padding: 34px; box-shadow: 0 16px 50px rgba(99,102,241,.12); }
  .head { text-align: center; margin-bottom: 26px; }
  .head .emoji { font-size: 40px; }
  h1 { font-size: 1.6rem; color: #312e81; margin: 8px 0 4px; }
  .date { font-size: .82rem; color: #a1a1aa; }
  .input-row { display: flex; gap: 8px; }
  input { flex: 1; padding: 12px 16px; border: 1.5px solid #e4e4e7; border-radius: 10px; font-size: .92rem; outline: none; }
  input:focus { border-color: #6366f1; }
  button { background: #6366f1; color: #fff; border: none; padding: 0 20px; border-radius: 10px; font-size: .9rem; cursor: pointer; font-weight: 600; }
  button:hover { background: #4f46e5; }
  .stats { display: flex; justify-content: space-between; align-items: center; margin: 22px 0 10px; font-size: .82rem; color: #71717a; }
  .clear { background: none; color: #a1a1aa; padding: 4px; font-size: .8rem; }
  .clear:hover { color: #ef4444; }
  .list { list-style: none; }
  li { display: flex; align-items: center; gap: 12px; padding: 13px 4px; border-bottom: 1px solid #f4f4f5; animation: slide .25s ease; }
  @keyframes slide { from { opacity: 0; transform: translateY(-8px); } }
  .check { width: 20px; height: 20px; border: 2px solid #d4d4d8; border-radius: 6px; cursor: pointer; flex: 0 0 auto;
           display: grid; place-items: center; color: #fff; font-size: 12px; transition: .2s; }
  .check.done { background: #6366f1; border-color: #6366f1; }
  .text { flex: 1; font-size: .92rem; color: #3f3f46; }
  .text.done { text-decoration: line-through; color: #b8b8c0; }
  .del { background: none; color: #d4d4d8; padding: 2px 8px; font-size: 1.1rem; }
  .del:hover { color: #ef4444; }
  .empty { text-align: center; color: #b8b8c0; padding: 40px 0; font-size: .9rem; }
  .progress { height: 6px; background: #f4f4f5; border-radius: 10px; margin-top: 22px; overflow: hidden; }
  .progress div { height: 100%; background: linear-gradient(90deg, #6366f1, #a855f7); width: 0; transition: .3s; border-radius: 10px; }
  .foot { text-align: center; font-size: .76rem; color: #c4c4cc; margin-top: 18px; }
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <div class="emoji">✅</div>
    <h1>今日待办</h1>
    <div class="date" id="date"></div>
  </div>
  <div class="input-row">
    <input type="text" id="input" placeholder="添加一件要做的事…" maxlength="80">
    <button onclick="add()">添加</button>
  </div>
  <div class="stats">
    <span id="stat">共 0 项 · 已完成 0 项</span>
    <button class="clear" onclick="clearDone()">清除已完成</button>
  </div>
  <ul class="list" id="list"></ul>
  <div class="progress"><div id="bar"></div></div>
  <div class="foot">纯前端交互示例 · 数据仅保存在当前页面</div>
</div>
<script>
  const seed = [
    { text: '整理本周工作表', done: true },
    { text: '给客户回复方案邮件', done: false },
    { text: '下午三点团队同步', done: false },
    { text: '读 20 页书', done: false }
  ];
  let items = seed.slice();

  document.getElementById('date').textContent = new Date().toLocaleDateString('zh-CN',
    { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });

  function render() {
    const list = document.getElementById('list');
    list.innerHTML = '';
    if (!items.length) {
      list.innerHTML = '<div class="empty">🎉 全部完成，休息一下吧</div>';
    }
    items.forEach((it, i) => {
      const li = document.createElement('li');
      li.innerHTML = `<div class="check ${it.done ? 'done' : ''}" onclick="toggle(${i})">${it.done ? '✓' : ''}</div>
                      <span class="text ${it.done ? 'done' : ''}">${it.text}</span>
                      <button class="del" onclick="remove(${i})">×</button>`;
      list.appendChild(li);
    });
    const done = items.filter(x => x.done).length;
    document.getElementById('stat').textContent = `共 ${items.length} 项 · 已完成 ${done} 项`;
    document.getElementById('bar').style.width = (items.length ? done / items.length * 100 : 0) + '%';
  }
  function add() {
    const input = document.getElementById('input');
    const v = input.value.trim();
    if (!v) return;
    items.push({ text: v, done: false });
    input.value = '';
    render();
  }
  function toggle(i) { items[i].done = !items[i].done; render(); }
  function remove(i) { items.splice(i, 1); render(); }
  function clearDone() { items = items.filter(x => !x.done); render(); }
  document.getElementById('input').addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
  render();
</script>
</body>
</html>
